name: energieboard
services:
  energieboard:
    image: energieboard:${ENERGIEBOARD_VERSION:-2.6.0}
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_URL: ${MONGO_URL:?MONGO_URL muss auf eine vorhandene MongoDB zeigen}
      DB_NAME: ${DB_NAME:-energieboard}
    ports:
      - "${ENERGIEBOARD_BIND:-0.0.0.0}:${ENERGIEBOARD_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
